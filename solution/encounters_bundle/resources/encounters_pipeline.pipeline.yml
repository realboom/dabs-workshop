resources:
  pipelines:
    encounters_pipeline:
      name: encounters_pipeline
      libraries:
        - glob:
            include: ../src/transformations/**
      catalog: ${var.catalog}
      root_path: ../src
      schema: ${var.schema}
      serverless: true
      configuration:
        source_catalog: ${var.source_catalog}
        source_schema: ${var.source_schema}
