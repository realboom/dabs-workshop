# Declarative Automation Bundle for the DABs hands-on workshop (finished version).
# Started from `databricks bundle init default-python` (no job, pipeline, or package). The four
# assets were imported with `databricks bundle generate`, then their dev values were replaced
# with variables and references.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: encounters_bundle
  uuid: c95ab8d6-cde5-4e2f-808a-14eb5984ffe4

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  source_catalog:
    description: Catalog that holds the source data the pipeline reads
  source_schema:
    description: Schema that holds the source data the pipeline reads
  warehouse_id:
    description: SQL warehouse for the dashboard and the Genie agent
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://<your-workspace-url>
    variables:
      catalog: <your_catalog>
      schema: <your_schema>
      source_catalog: <your_catalog>
      source_schema: analyst101_shared
  prod:
    # Production is deployed by CI/CD as a service principal (see cicd/deploy-prod.yml).
    mode: production
    workspace:
      host: https://<your-workspace-url>
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: <cicd_service_principal_id>
    variables:
      catalog: <prod_catalog>
      schema: <prod_schema>
      source_catalog: <prod_catalog>
      source_schema: analyst101_shared
    permissions:
      - service_principal_name: <cicd_service_principal_id>
        level: CAN_MANAGE
      - group_name: <your_team_group>
        level: CAN_VIEW
