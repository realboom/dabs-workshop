# The encounters pipeline: silver_encounters -> gold_encounters, written to your schema.
resources:
  pipelines:
    encounters_pipeline:
      name: encounters_pipeline
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: ../src
      libraries:
        - glob:
            include: ../src/transformations/**
      configuration:
        source_catalog: ${var.source_catalog}
        source_schema: ${var.source_schema}
